<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>TalentOS Application Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #7c3aed;
    --primary-hover: #6d28d9;
    --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
    --primary-light: #f3e8ff;
    --primary-dark: #5b21b6;
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --success-bg: #f0fdf4;
    --success-text: #15803d;
    --success-border: #bbf7d0;
    --error-bg: #fef2f2;
    --error-text: #b91c1c;
    --error-border: #fecaca;
    --warning-bg: #fffbeb;
    --warning-text: #92400e;
    --warning-border: #fcd34d;
    --badge-high-bg: #dcfce7;
    --badge-high-fg: #15803d;
    --badge-med-bg: #fef9c3;
    --badge-med-fg: #a16207;
    --badge-low-bg: #fee2e2;
    --badge-low-fg: #b91c1c;
    --badge-file-bg: #e0f2fe;
    --badge-file-fg: #0369a1;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 13px;
    margin: 0;
    padding: 16px;
    width: 100%;
    max-width: 100%;
    min-width: 320px;
    background: var(--bg-main);
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
  }

  h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: -0.3px;
  }

  h1::before {
    content: '';
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 10px rgba(124, 58, 237, 0.6);
  }

  .meta {
    font-size: 11px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    word-break: break-word;
    font-weight: 500;
    line-height: 1.4;
  }

  .tabs {
    display: flex;
    background: #e2e8f0;
    padding: 3px;
    border-radius: 10px;
    margin-bottom: 14px;
  }

  .tab {
    flex: 1;
    padding: 7px 12px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .tab.active {
    background: #ffffff;
    color: var(--primary-dark);
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
  }

  .tabPanel { display: none; }
  .tabPanel.active { display: block; }

  .form-group {
    margin-bottom: 12px;
  }

  label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 5px;
  }

  select, input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text-main);
    font-size: 12px;
    font-family: inherit;
    transition: all 0.15s ease;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
  }

  select:focus, input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
  }

  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }

  button {
    width: 100%;
    padding: 10px 16px;
    border: 0;
    border-radius: 9px;
    background: var(--primary-gradient);
    color: #ffffff;
    font-weight: 600;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 2px 6px rgba(124, 58, 237, 0.25);
  }

  button:hover:not(:disabled) {
    background: linear-gradient(135deg, #6d28d9 0%, #4f46e5 100%);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35);
  }

  button:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: 0 1px 3px rgba(124, 58, 237, 0.2);
  }

  button:disabled {
    background: #e2e8f0;
    color: #94a3b8;
    cursor: not-allowed;
    box-shadow: none;
  }

  button.secondary {
    background: #ffffff;
    color: #334155;
    border: 1px solid #cbd5e1;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
  }

  button.secondary:hover:not(:disabled) {
    background: #f8fafc;
    border-color: #94a3b8;
    color: #0f172a;
    box-shadow: 0 3px 8px rgba(15, 23, 42, 0.08);
  }

  .status {
    font-size: 12px;
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 9px;
    min-height: 38px;
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1.45;
    transition: all 0.2s ease;
  }

  .status.error {
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid var(--error-border);
  }

  .status.success {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid var(--success-border);
  }

  .status.warning {
    background: var(--warning-bg);
    color: var(--warning-text);
    border: 1px solid var(--warning-border);
  }

  .status.loading {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #e2e8f0;
  }

  .btnDraft {
    margin-top: 6px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--primary-dark);
    background: #f3e8ff;
    border: 1px solid #d8b4fe;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 0 1px 2px rgba(124, 58, 237, 0.08);
  }

  .btnDraft:hover {
    background: #e9d5ff;
    border-color: var(--primary);
    transform: translateY(-1px);
  }

  .btnDraft:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid #cbd5e1;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #planPreview {
    max-height: 240px;
    overflow-y: auto;
    margin-top: 12px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background: var(--card-bg);
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }

  .planHeader {
    padding: 9px 12px;
    background: #f1f5f9;
    border-bottom: 1px solid var(--border-color);
    font-size: 11px;
    font-weight: 600;
    color: #475569;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .planRow {
    padding: 9px 12px;
    border-bottom: 1px solid #f1f5f9;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    transition: background 0.15s ease;
  }

  .planRow:last-child { border-bottom: 0; }
  .planRow:hover { background: #f8fafc; }
  .planRow.low { background: #fffdf5; }

  .planRowTop {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .planLabel {
    color: #334155;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 220px;
  }

  .planVal {
    font-weight: 600;
    color: var(--text-main);
    word-break: break-all;
  }

  .badge {
    font-weight: 600;
    font-size: 10px;
    border-radius: 5px;
    padding: 2px 7px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  .badge.high { background: var(--badge-high-bg); color: var(--badge-high-fg); }
  .badge.medium { background: var(--badge-med-bg); color: var(--badge-med-fg); }
  .badge.low { background: var(--badge-low-bg); color: var(--badge-low-fg); }
  .badge.file { background: var(--badge-file-bg); color: var(--badge-file-fg); }
  .badge.skip { background: #f1f5f9; color: #64748b; }
  .badge.ai_answer { background: #fae8ff; color: #86198f; }

  #chatLog {
    max-height: 250px;
    overflow-y: auto;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    background: var(--card-bg);
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }

  .chatMsg {
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
  }

  .chatMsg .who {
    font-weight: 600;
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .chatMsg.user .who { color: var(--primary); }
  .chatMsg .bubble {
    padding: 9px 12px;
    border-radius: 9px;
    background: #f1f5f9;
    color: var(--text-main);
    line-height: 1.45;
  }

  .chatMsg.user .bubble {
    background: var(--primary-light);
    color: var(--primary-dark);
    font-weight: 500;
  }

  .chatRow {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .chatRow input { margin: 0; flex: 1; }
  .chatRow button { width: auto; margin: 0; padding: 9px 16px; }

  #settings {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-color);
  }

  #settings.open { display: block; }
</style>
</head>
<body>
<div class="header">
  <h1>TalentOS Copilot</h1>
</div>
<div class="meta" id="pageTitle">—</div>

<div class="tabs">
  <div class="tab active" id="tabFill">Fill Form</div>
  <div class="tab" id="tabChat">Copilot Chat</div>
</div>

<div class="tabPanel active" id="panelFill">
  <div class="form-group">
    <label>Candidate</label>
    <select id="candidateSelect"><option>Loading…</option></select>
  </div>
  <div class="form-group">
    <label>Resume Profile</label>
    <select id="resumeSelect"><option>—</option></select>
  </div>

  <div class="btn-group">
    <button id="analyzeBtn">Analyze Form</button>
    <button class="secondary" id="fillBtn" disabled>Fill Form</button>
    <button class="secondary" id="saveBtn" disabled>Save &amp; Learn</button>
    <button class="secondary" id="resumeFileBtn" disabled>Attach Resume PDF</button>
    <button class="secondary" id="coverLetterBtn" disabled>Generate Cover Letter</button>
  </div>

  <div id="planPreview"></div>
  <div class="status" id="status"></div>
</div>

<div class="tabPanel" id="panelChat">
  <div class="meta">Ask questions about the current form fields, candidate profile, or fill plan reasoning.</div>
  <div id="chatLog"></div>
  <div class="chatRow">
    <input id="chatInput" type="text" placeholder="Ask a question…"/>
    <button id="chatSendBtn">Send</button>
  </div>
</div>

<button class="secondary" id="toggleSettings" style="margin-top: 12px;">Settings</button>
<div id="settings">
  <div class="form-group">
    <label>TalentOS URL</label>
    <input id="baseUrl"/>
  </div>
  <div class="form-group">
    <label>API Key (tos_…)</label>
    <input id="apiKey" type="password"/>
  </div>
  <button id="saveSettings">Save Settings</button>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="pdfGen.js"></script>
<script src="popup.js"></script>
</body>
</html>
