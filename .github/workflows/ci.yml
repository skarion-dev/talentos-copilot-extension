name: Extension CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: Check extension JavaScript
        run: node --check popup.js && node --check content.js && node --check background.js && node --check pdfGen.js
      - name: Run browser fixture tests
        run: npm test
