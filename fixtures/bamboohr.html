<!doctype html>
<div class="bamboohr-careers">
  <div class="form-group"><label for="b-first">First name</label><input id="b-first" name="firstName" required></div>
  <div class="form-group"><label for="b-email">Email address</label><input id="b-email" name="email" type="email" required></div>
  <div class="form-group"><label>Work authorization</label><select name="workAuth"><option>Select...</option><option>Authorized</option><option>Not authorized</option></select></div>
  <div class="form-group"><span class="question-label">Veteran status</span><div><label><input type="radio" name="veteran"> Yes</label><label><input type="radio" name="veteran"> No</label></div></div>
  <div class="form-group"><label>Additional context</label><input name="uncertain"></div>
  <div class="form-group"><label>Resume</label><input name="resume" type="file"></div>
</div>
