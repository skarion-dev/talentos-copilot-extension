<!doctype html>
<form class="workable-form">
  <div class="field-container"><label for="w-first">First name</label><input id="w-first" name="firstName" required></div>
  <div class="field-container"><label for="w-email">Email</label><input id="w-email" name="email" type="email" required></div>
  <div class="field-container"><label>Work authorization</label><select name="workAuth"><option>Select...</option><option>Authorized</option><option>Not authorized</option></select></div>
  <fieldset><legend>Veteran status</legend><label><input type="radio" name="veteran" value="yes"> Yes</label><label><input type="radio" name="veteran" value="no"> No</label></fieldset>
  <div class="field-container"><label>Additional context</label><input name="uncertain"></div>
  <div class="field-container"><label>Resume</label><input name="resume" type="file"></div>
</form>
